<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            <div class="mark"></div>
            <span>Aria</span>
        </div>

        <h1>Welcome Back! Login</h1>

        <p class="subtitle">
            Login to continue your conversations.
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                id="loginBtn"
                class="auth-btn"
            >
                Login
            </button>

        </form>

        <p class="auth-switch">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
